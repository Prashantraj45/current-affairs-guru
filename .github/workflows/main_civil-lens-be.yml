name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          script: |
            set -e

            cd /home/ec2-user/current-affairs-guru

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Cleaning up invalid Render environment variables..."
            sed -i '/PUPPETEER_CACHE_DIR/d' .env || true

            echo "Installing dependencies..."
            npm ci

            echo "Installing Puppeteer Chrome..."
            npx puppeteer browsers install chrome

            echo "Restarting application..."
            pm2 reload js-backend || pm2 start src/api/server.js --name js-backend

            echo "Deployment completed successfully."